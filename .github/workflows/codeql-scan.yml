name: "CodeQL Security Analysis"

on:
  workflow_call:
    inputs:
      language:
        description: 'Language to analyze (e.g. javascript-typescript, python, go)'
        required: false
        type: string
        default: 'javascript-typescript'
  workflow_dispatch:
    inputs:
      language:
        description: 'Language to analyze'
        required: false
        type: string
        default: 'javascript-typescript'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ inputs.language || 'javascript-typescript' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:${{ inputs.language || 'javascript-typescript' }}"
